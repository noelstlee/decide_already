[project]
name = "decide-already"
version = "0.1.0"
description = "A local-first document vault where a decision model (Jev) sorts files into groups you name, and you correct it."
authors = [
    { name = "SeungTaek Lee", email = "noelstlee@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "typesafe-sdk==0.7.5",
]

[project.scripts]
p0 = "decide_already.cli:app"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
