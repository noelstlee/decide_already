[project]
name = "decide-already"
version = "0.1.0"
description = "A local-first document vault where a decision model (Jev) sorts files into groups you name, and you correct it."
authors = [
    { name = "SeungTaek Lee", email = "noelstlee@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.0",
    "pydantic>=2.12",
    "pymupdf>=2.1",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "typesafe-sdk==0.7.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
p0 = "decide_already.cli:app"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
eval = [
    "anthropic>=2.8.0",
    "fastembed>=0.9.1",
]

[tool.uv]
default-groups = ["dev", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PyMuPDF's compiled module triggers these on import; they are not ours to fix.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
